# Usage documentation: lint_workflows.md

on:
  workflow_call:

jobs:
  lint:
    name: Lint .github/workflows/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up environment
        run: pipx install zizmor
      - name: Run zizmor
        run: zizmor .
    permissions:
      contents: read
