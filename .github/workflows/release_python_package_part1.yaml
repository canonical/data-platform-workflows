on:
  workflow_call:
    outputs:
      git-tag:
        description: Semantic version git tag
        value: ${{ jobs.tag.outputs.tag }}
      artifact-name:
        description: Python package distributions are uploaded to this GitHub artifact name
        value: python-package-distributions

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install CLI
        run: pipx install git+https://github.com/canonical/data-platform-workflows@"${VAR_SHA}"#subdirectory=_cli
        env:
          VAR_SHA: ${{ job.workflow_sha }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0  # Checkout history with git tags
      - name: Create release tag
        id: create-tag
        run: create-semantic-version-tag
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
    permissions:
      contents: write  # Needed to create git tag
  
  build:
    name: Build package
    needs:
      - tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0  # Checkout history with git tags
      - name: Install poetry
        run: |
          pipx install poetry
          pipx inject poetry 'poetry-dynamic-versioning[plugin]'
      - name: Build package
        run: poetry build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions  # Keep in sync with `artifact-name` output
          path: dist/
    permissions:
      contents: read
